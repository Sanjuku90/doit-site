services:
  - type: web
    name: do-it-web
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt && python -m compileall -q server.py postgres_compat.py finance
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DOIT_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: DOIT_SECURE_COOKIE
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DOIT_ADMIN_EMAIL
        sync: false
      - key: DOIT_ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: DOIT_WITHDRAW_FEE_PERCENT
        value: "2"
